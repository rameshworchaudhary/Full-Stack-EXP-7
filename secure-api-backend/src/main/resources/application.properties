server.port=5000

# Local-only secrets live outside source control in application-local.properties.
spring.config.import=optional:file:./application-local.properties

# Application Name
spring.application.name=secure-api

# MySQL Database Configuration using Environment Variables with Fallbacks
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:secure_api}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Secrets are supplied by the process environment. JWT_SECRET must be at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
app.aes.secret-key=${AES_SECRET_KEY}
app.seed-demo-users=${SEED_DEMO_USERS:false}
app.demo-admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo-user-password=${DEMO_USER_PASSWORD:}

# Logging
logging.level.com.secureapi=INFO
logging.level.org.springframework.security=INFO
